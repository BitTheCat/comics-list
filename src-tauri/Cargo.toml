[package]
name = "comics_list_tauri"
version = "0.1.0"
authors = ["comics-list"]
edition = "2021"

[dependencies]
tauri = { version = "1.4", features = ["api-all"] }
rusqlite = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "4.0"
uuid = { version = "1.4", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

